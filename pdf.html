<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PDF Text Editor - Student Help Club</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #007bff; /* PDF ke liye Blue theme */
            --primary-hover: #0056b3;
            --dark: #0f172a; 
            --text-main: #334155; 
            --bg-body: #f8fafc; 
            --border-color: #e2e8f0; 
            --transition: all 0.25s ease;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        .header { background: #fff; padding: 16px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-title { font-size: 1.25rem; color: var(--dark); font-weight: 800; }
        
        .workspace-container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .tool-card { background: #ffffff; padding: 40px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .tool-card h1 { font-size: 1.8rem; color: var(--dark); font-weight: 800; margin-bottom: 10px; text-align: center; }
        .tool-card p { text-align: center; color: #64748b; margin-bottom: 30px; }

        .upload-box { border: 2px dashed var(--primary); padding: 30px; border-radius: 16px; text-align: center; background: #eff6ff; margin-bottom: 25px; position: relative; }
        .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--dark); }
        .input-group input[type="text"] { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; transition: var(--transition); }
        .input-group input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }

        .main-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .main-btn:hover { background: var(--primary-hover); }
        .main-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .processing-box { display: none; text-align: center; margin-top: 20px; padding: 15px; background: #fffbeb; border-radius: 10px; border: 1px solid #fde68a; color: #d97706; font-weight: 600; }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="brand">
            <div class="brand-title">Student Help Club</div>
        </a>
    </header>

    <div class="workspace-container">
        <div class="tool-card">
            <h1><i class="fas fa-file-pdf" style="color: #ef4444;"></i> Smart PDF Editor</h1>
            <p>Replace any word in your PDF instantly (Great for Resumes & Dates)</p>
            
            <div class="upload-box" id="dropZone">
                <input type="file" id="pdfInput" accept="application/pdf">
                <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"></i>
                <h3 id="fileNameText">Click or Drag to Upload PDF</h3>
                <p style="font-size: 0.85rem; margin-top: 5px; color: #64748b;">Max file size: 5MB</p>
            </div>

            <div class="input-group">
                <label>Text to Find (Old Word):</label>
                <input type="text" id="oldText" placeholder="e.g., Manager">
            </div>

            <div class="input-group">
                <label>Replace With (New Word):</label>
                <input type="text" id="newText" placeholder="e.g., Director">
            </div>

            <button id="processBtn" class="main-btn"><i class="fas fa-magic"></i> Edit & Download PDF</button>

            <div id="loadingBox" class="processing-box">
                <i class="fas fa-spinner fa-spin"></i> Processing on AI Server... Please wait.
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const pdfInput = document.getElementById('pdfInput');
            const fileNameText = document.getElementById('fileNameText');
            const processBtn = document.getElementById('processBtn');
            const oldTextInput = document.getElementById('oldText');
            const newTextInput = document.getElementById('newText');
            const loadingBox = document.getElementById('loadingBox');

            let currentFile = null;

            // Handle File Selection
            pdfInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    currentFile = e.target.files[0];
                    
                    // 5MB Limit check
                    if (currentFile.size > 5 * 1024 * 1024) {
                        alert("File is too large! Please upload a PDF under 5MB.");
                        pdfInput.value = "";
                        fileNameText.innerText = "Click or Drag to Upload PDF";
                        currentFile = null;
                        return;
                    }

                    if(currentFile.type !== "application/pdf") {
                        alert("Please upload a valid PDF file.");
                        return;
                    }

                    fileNameText.innerText = currentFile.name;
                    fileNameText.style.color = "#00b14f";
                }
            });

            // Process Button Click
            processBtn.addEventListener('click', async function() {
                if (!currentFile) {
                    alert("Please upload a PDF file first.");
                    return;
                }
                if (!oldTextInput.value.trim() || !newTextInput.value.trim()) {
                    alert("Please enter both the Old Text and the New Text.");
                    return;
                }

                processBtn.disabled = true;
                loadingBox.style.display = "block";

                try {
                    const formData = new FormData();
                    formData.append("file", currentFile);
                    formData.append("old_text", oldTextInput.value);
                    formData.append("new_text", newTextInput.value);

                    // Calling Hugging Face PDF API
                    const response = await fetch("https://vishal62023-pdf-editor.hf.space/edit-pdf", {
                        method: "POST",
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error("Server error! Make sure the space is Running.");
                    }

                    // Receive edited PDF as Blob
                    const pdfBlob = await response.blob();
                    const url = window.URL.createObjectURL(pdfBlob);
                    
                    // Auto-Download the file
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Edited_${currentFile.name}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    alert("PDF Edited Successfully! Check your downloads.");

                } catch(error) {
                    console.error(error);
                    alert("Error: " + error.message);
                } finally {
                    processBtn.disabled = false;
                    loadingBox.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
