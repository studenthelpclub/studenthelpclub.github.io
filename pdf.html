<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Text OCR - Extract Text from PDF | Student Help Club</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #8b5cf6; --primary-hover: #7c3aed; --dark: #0f172a; --text-main: #334155; --bg-body: #f8fafc; --border: #e2e8f0; --transition: all 0.3s ease; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        .header { background: #fff; padding: 16px 6%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
        .brand-title { font-size: 1.25rem; color: var(--dark); font-weight: 800; text-decoration: none;}

        .workspace-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .tool-card { background: #ffffff; padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .tool-card h1 { font-size: 1.8rem; color: var(--dark); font-weight: 800; text-align: center; margin-bottom: 5px; }
        .tool-card p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-weight: 500;}
        
        .upload-box { border: 2px dashed var(--primary); padding: 40px 20px; border-radius: 16px; text-align: center; background: #f5f3ff; margin-bottom: 25px; position: relative; cursor: pointer; transition: var(--transition); }
        .upload-box:hover { background: #ede9fe; border-color: var(--primary-hover); }
        .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .main-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: var(--transition); }
        .main-btn:hover { background: var(--primary-hover); }
        .main-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        .processing-box { display: none; text-align: center; margin-top: 20px; padding: 20px; background: #f5f3ff; border-radius: 12px; border: 1px solid #ddd6fe; color: #7c3aed; font-weight: 700; }

        /* Naya Result Editor UI */
        .result-container { display: none; margin-top: 30px; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .result-header h3 { font-size: 1.2rem; color: var(--dark); }
        .action-btns { display: flex; gap: 10px; }
        .action-btn { background: #f1f5f9; color: var(--dark); border: 1px solid var(--border); padding: 8px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { background: #e2e8f0; }
        .btn-copy { background: #10b981; color: white; border-color: #10b981; }
        .btn-copy:hover { background: #059669; }

        textarea.editor-box { width: 100%; height: 500px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; font-size: 1rem; line-height: 1.8; color: var(--dark); outline: none; resize: vertical; background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        textarea.editor-box:focus { border-color: var(--primary); }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="brand-title">Student Help Club</a>
    </header>

    <div class="workspace-container">
        <div class="tool-card">
            <h1><i class="fas fa-file-alt" style="color: var(--primary);"></i> Image to Text (OCR)</h1>
            <p class="subtitle">Extract pure text from scanned Hindi & English PDFs without the image background.</p>
            
            <div class="upload-box" id="uploadBox">
                <input type="file" id="pdfInput" accept="application/pdf">
                <i class="fas fa-file-upload" style="font-size: 45px; color: var(--primary); margin-bottom: 15px;"></i>
                <h3 id="fileNameText" style="color: var(--dark);">Click or Drag to Upload PDF</h3>
            </div>

            <button class="main-btn" id="processBtn" disabled><i class="fas fa-cogs"></i> Extract Text Now</button>

            <div id="loadingBox" class="processing-box">
                <i class="fas fa-sync fa-spin" style="font-size: 24px; margin-bottom: 10px; display: block;"></i>
                <span>Extracting Text (Reading Hindi & English)...</span>
            </div>

            <div id="resultArea" class="result-container">
                <div class="result-header">
                    <h3><i class="fas fa-check-circle" style="color: #10b981;"></i> Extracted Text</h3>
                    <div class="action-btns">
                        <button class="action-btn btn-copy" onclick="copyText()"><i class="fas fa-copy"></i> Copy All</button>
                        <button class="action-btn" onclick="downloadTxt()"><i class="fas fa-download"></i> Save .txt</button>
                    </div>
                </div>
                <textarea id="resultText" class="editor-box" placeholder="Your extracted text will appear here..."></textarea>
            </div>

        </div>
    </div>

    <script>
        const pdfInput = document.getElementById('pdfInput');
        const fileNameText = document.getElementById('fileNameText');
        const processBtn = document.getElementById('processBtn');
        const loadingBox = document.getElementById('loadingBox');
        const resultArea = document.getElementById('resultArea');
        const resultText = document.getElementById('resultText');
        
        let currentFile = null;

        pdfInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                currentFile = e.target.files[0];
                fileNameText.innerText = currentFile.name;
                processBtn.disabled = false;
                resultArea.style.display = "none";
            }
        });

        processBtn.addEventListener('click', async function() {
            if (!currentFile) return;

            processBtn.style.display = "none";
            loadingBox.style.display = "block";
            resultArea.style.display = "none";

            try {
                const formData = new FormData();
                formData.append("file", currentFile);

                // Updated API URL to /extract-text
                const response = await fetch("https://vishal62023-pdf-editor.hf.space/extract-text", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) throw new Error("Server error.");

                const data = await response.json();
                
                // Show text in textarea
                resultText.value = data.text;
                resultArea.style.display = "block";
                resultArea.scrollIntoView({ behavior: 'smooth' });

            } catch(err) {
                alert("Error extracting text. Server might be waking up.");
            } finally {
                processBtn.style.display = "block";
                loadingBox.style.display = "none";
                processBtn.innerHTML = "<i class='fas fa-redo'></i> Extract Another PDF";
            }
        });

        function copyText() {
            resultText.select();
            document.execCommand('copy');
            alert("Text Copied to Clipboard!");
        }

        function downloadTxt() {
            const element = document.createElement('a');
            const file = new Blob([resultText.value], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = "Extracted_Text.txt";
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
