<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Blog Admin | SHC</title>
    <style>
        :root { --primary: #003366; --bg: #f0f2f5; --success: #27ae60; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .top-nav { background: var(--white); border-bottom: 2px solid var(--primary); padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .admin-container { max-width: 800px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .btn-push { width: 100%; padding: 15px; background: var(--success); color: white; border: none; border-radius: 6px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #login-section { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        #admin-panel { display: none; }
        .image-tool { background: #eef2f5; padding: 15px; border-radius: 8px; border: 2px dashed #b2bec3; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="top-nav">SHC Tools Blog Admin (Free Image Hosting)</div>

<div id="login-section">
    <h3>Admin Login</h3>
    <div class="form-group"><input type="email" id="login_email" placeholder="Email"></div>
    <div class="form-group"><input type="password" id="login_pass" placeholder="Password"></div>
    <button id="loginBtn" class="btn-push" style="background:var(--primary);">Login</button>
</div>

<div id="admin-panel">
    <div class="admin-container">
        
        <div class="image-tool">
            <label style="color:#e74c3c;">📸 Quick Image Link Generator (Article ke beech mein photo lagane ke liye)</label>
            <input type="file" id="quick_img" accept="image/*" style="margin-bottom:10px;">
            <button id="quickImgBtn" style="background:#f39c12; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Upload & Get Link</button>
            <input type="text" id="quick_img_link" placeholder="Image link yahan aayega, isko copy karke article mein use karein" readonly style="margin-top:10px; background:#fff;">
        </div>

        <div class="form-group">
            <label>Tool Category</label>
            <input type="text" id="blog_category" list="tool-categories" placeholder="Start typing category...">
            <datalist id="tool-categories">
                <option value="Image Resizer In KB">
                <option value="PDF Size Reducer">
                <option value="PDF Split & Merge">
                <option value="PDF to Image Converter">
                <option value="Image Background Remover">
                <option value="ATS Resume Builder">
                <option value="Age & Percentage Calculator">
                <option value="Sarkari Job Updates">
                <option value="IGNOU Assignments">
                <option value="General Update">
            </datalist>
        </div>
        
        <div class="form-group">
            <label>Main Blog Thumbnail (Cover Photo)</label>
            <input type="file" id="blog_thumbnail" accept="image/*">
        </div>

        <div class="form-group">
            <label>Article Title</label>
            <input type="text" id="blog_title" placeholder="SSC Exams ke liye Photo kaise compress karein?">
        </div>
        
        <div class="form-group">
            <label>Short Excerpt (Homepage par dikhane ke liye)</label>
            <textarea id="blog_excerpt" rows="3" placeholder="Short description here..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Full Content (HTML tags allowed)</label>
            <textarea id="blog_content" rows="10" placeholder="<p>Full article details here...</p>"></textarea>
        </div>
        
        <div class="form-group">
            <label>Tool Link (Optional)</label>
            <input type="text" id="tool_link" placeholder="https://shctools.in/image-resizer">
        </div>
        
        <button class="btn-push" id="submitBtn">PUBLISH ARTICLE</button>
    </div>
</div>

<script type="module">
    // Firebase se Storage Hata diya gaya hai, Sirf Database use hoga
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAYE9Q_Lub0aHDHsibMp-v6Ov4Dz25jyLE",
        authDomain: "tools-blog.firebaseapp.com",
        projectId: "tools-blog",
        storageBucket: "tools-blog.firebasestorage.app",
        messagingSenderId: "657535253741",
        appId: "1:657535253741:web:854e9563a5db4f983ee0e4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- YAHAN APNI IMGBB API KEY DALEIN ---
    const IMGBB_API_KEY = "ad3252454af3aaf0a6331c06f7a1ba9d"; 

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
        }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, document.getElementById('login_email').value, document.getElementById('login_pass').value)
        .catch(err => alert("Login Failed!"));
    });

    // IMGBB Upload Function (100% Free)
    async function uploadToImgBB(file) {
        const formData = new FormData();
        formData.append("image", file);
        
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if(data.success) {
            return data.data.url;
        } else {
            throw new Error("Image Upload Failed");
        }
    }

    // Quick Image Link Generator Logic
    document.getElementById('quickImgBtn').addEventListener('click', async () => {
        if(IMGBB_API_KEY === "YAHAN_APNI_IMGBB_API_KEY_DALEIN") return alert("Pehle ImgBB API Key code me dalein!");
        
        const file = document.getElementById('quick_img').files[0];
        if(!file) return alert("Pehle ek image select karein!");
        
        document.getElementById('quickImgBtn').innerText = "Uploading...";
        try {
            const url = await uploadToImgBB(file);
            document.getElementById('quick_img_link').value = url;
            document.getElementById('quickImgBtn').innerText = "Upload & Get Link";
        } catch(e) {
            alert(e.message);
            document.getElementById('quickImgBtn').innerText = "Upload & Get Link";
        }
    });

    document.getElementById('submitBtn').addEventListener('click', async () => {
        const title = document.getElementById('blog_title').value;
        const category = document.getElementById('blog_category').value;
        const excerpt = document.getElementById('blog_excerpt').value;
        const content = document.getElementById('blog_content').value;
        const toolLink = document.getElementById('tool_link').value;
        const thumbFile = document.getElementById('blog_thumbnail').files[0];

        if(!title || !category || !excerpt || !content) return alert("Title, Category, Excerpt aur Content zaruri hai!");
        if(IMGBB_API_KEY === "ad3252454af3aaf0a6331c06f7a1ba9d") return alert("Pehle ImgBB API Key code me dalein!");

        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');

        try {
            document.getElementById('submitBtn').innerText = "UPLOADING THUMBNAIL & PUBLISHING...";

            // Thumbnail Upload (Free Via ImgBB)
            let thumbnailUrl = "https://via.placeholder.com/600x400?text=SHC+Tools"; 
            if(thumbFile) {
                thumbnailUrl = await uploadToImgBB(thumbFile);
            }

            // 1. Firebase mein Data Save karna (Sirf Text aur Link jayega, Image ImgBB par rahegi)
            await addDoc(collection(db, "blog_posts"), {
                title: title,
                slug: slug,
                category: category,
                excerpt: excerpt,
                content: content,
                thumbnailUrl: thumbnailUrl,
                toolLink: toolLink,
                timestamp: serverTimestamp()
            });

            // 2. Google Script (Telegram) Trigger
            const postUrl = `https://shctools.in/article.html?post=${slug}`;
            const googleServerUrl = "https://script.google.com/macros/s/AKfycbwLnWNqq5z8D8jFFFe8FnYmrisXWGrefJgNXQurmncmGO9R7jciS0DFR67WSyiDQdI/exec";
            const finalUrl = googleServerUrl + "?title=" + encodeURIComponent(title) + "&url=" + encodeURIComponent(postUrl);
            
            fetch(finalUrl, { mode: 'no-cors' }).catch(err => console.log("Telegram alert issue"));

            setTimeout(() => {
                alert("Article Published Successfully! Telegram notification sent.");
                location.reload();
            }, 1500);

        } catch (e) {
            alert("Error: " + e.message);
            document.getElementById('submitBtn').innerText = "PUBLISH ARTICLE";
        }
    });
</script>
</body>
</html>
