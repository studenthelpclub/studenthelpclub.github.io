<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHC Blog Admin | Anti-Block Mode</title>
    <style>
        :root { --primary: #003366; --bg: #f4f7f6; --success: #27ae60; --warning: #f39c12; --danger: #e74c3c; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        .top-nav { background: var(--primary); padding: 15px 20px; text-align: center; font-size: 1.4rem; font-weight: bold; color: var(--white); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .admin-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .step-box { background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid var(--primary); }
        .step-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
        .help-text { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 8px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,51,102,0.1); }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-success { background: var(--success); width: 100%; font-size: 1.2rem; padding: 15px; }
        .btn-success:hover { background: #219653; }
        .btn-warning { background: var(--warning); }
        .image-generator { background: #fff8e1; border: 2px dashed var(--warning); padding: 20px; border-radius: 8px; text-align: center; }
        .code-box { background: #2c3e50; color: #4afe4a; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 1.1rem; margin-top: 15px; display: none; word-wrap: break-word; }
        #login-section { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        #admin-panel { display: none; }
    </style>
</head>
<body>

<div class="top-nav">SHC Blog Admin (Anti-Block Proxy Mode)</div>

<div id="login-section">
    <h3 style="color: var(--primary);">Admin Login</h3>
    <div class="form-group"><input type="email" id="login_email" placeholder="Email"></div>
    <div class="form-group"><input type="password" id="login_pass" placeholder="Password"></div>
    <button id="loginBtn" class="btn" style="background:var(--primary); width: 100%;">Login to Dashboard</button>
</div>

<div id="admin-panel">
    <div class="admin-container">
        
        <div class="step-box" style="border-left-color: var(--danger);">
            <div class="step-title">⚙️ Step 1: ImgBB API Setup</div>
            <span class="help-text">Apni ImgBB API key yahan save rakhein.</span>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="imgbb_api_key" placeholder="Paste your ImgBB API Key here...">
                <button id="saveKeyBtn" class="btn btn-warning" style="white-space: nowrap;">Save Key</button>
            </div>
        </div>

        <div class="step-box" style="border-left-color: var(--warning);">
            <div class="step-title">📸 Step 2: Article Ke Beech Me Image Lagane Ka Code</div>
            <div class="image-generator">
                <span class="help-text">Ab photo Proxy server ke through bypass hoke aayegi, PC me block nahi hogi!</span>
                <input type="file" id="quick_img" accept="image/*" style="margin-bottom:10px; background: white;">
                <button id="quickImgBtn" class="btn" style="background: var(--primary);">Upload & Get Code</button>
                
                <div id="code_box" class="code-box"></div>
            </div>
        </div>

        <div class="step-box" style="border-left-color: var(--success);">
            <div class="step-title">✍️ Step 3: Write & Publish Article</div>
            
            <div class="form-group">
                <label>Main Blog Thumbnail (Cover Photo)</label>
                <input type="file" id="blog_thumbnail" accept="image/*">
            </div>

            <div class="form-group">
                <label>Tool Category</label>
                <input type="text" id="blog_category" list="tool-categories" placeholder="Select or type category...">
                <datalist id="tool-categories">
                    <option value="Image Resizer In KB">
                    <option value="PDF Size Reducer">
                    <option value="Resume Builder">
                    <option value="Background Remover">
                    <option value="General Update">
                </datalist>
            </div>

            <div class="form-group">
                <label>Article Title</label>
                <input type="text" id="blog_title" placeholder="Title here...">
            </div>
            
            <div class="form-group">
                <label>Short Excerpt (Dikhaane ke liye)</label>
                <textarea id="blog_excerpt" rows="2" placeholder="Description here..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Full Content (Paste generated HTML here)</label>
                <textarea id="blog_content" rows="15" placeholder="<p>Start your HTML article here...</p>"></textarea>
            </div>
            
            <div class="form-group">
                <label>Tool Link (Optional)</label>
                <input type="text" id="tool_link" placeholder="https://shctools.in/image-resizer">
            </div>
            
            <button class="btn btn-success" id="submitBtn">🚀 PUBLISH ARTICLE NOW</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAYE9Q_Lub0aHDHsibMp-v6Ov4Dz25jyLE",
        authDomain: "tools-blog.firebaseapp.com",
        projectId: "tools-blog",
        storageBucket: "tools-blog.firebasestorage.app",
        messagingSenderId: "657535253741",
        appId: "1:657535253741:web:854e9563a5db4f983ee0e4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.onload = function() {
        const savedKey = localStorage.getItem("imgbb_key");
        if(savedKey) {
            document.getElementById("imgbb_api_key").value = savedKey;
        }
    };

    document.getElementById("saveKeyBtn").addEventListener("click", () => {
        const key = document.getElementById("imgbb_api_key").value.trim();
        if(!key) return alert("Please enter a valid key!");
        localStorage.setItem("imgbb_key", key);
        alert("✅ ImgBB API Key Saved Successfully!");
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
        } else {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
        }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, document.getElementById('login_email').value, document.getElementById('login_pass').value)
        .catch(err => alert("Login Failed!"));
    });

    // 🔥 PROXY TRICK: Upload to ImgBB but wrap URL in Cloud Proxy 🔥
    async function uploadToImgBB_WithProxy(file) {
        const apiKey = localStorage.getItem("imgbb_key");
        if(!apiKey) throw new Error("Pehle Step 1 me ImgBB API Key daalkar Save karein!");

        const formData = new FormData();
        formData.append("image", file);
        
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: "POST",
            body: formData
        });
        const data = await response.json();
        if(data.success) {
            // YAHAN MAGIC HAI: ImgBB ka URL 'wsrv.nl' proxy me wrap ho jayega
            // Ye proxy duniya ke har antivirus/adblocker ko bypass kar degi!
            return "https://wsrv.nl/?url=" + data.data.url;
        } else {
            throw new Error("ImgBB Upload Failed!");
        }
    }

    // Step 2: Quick Image Link Generator
    document.getElementById('quickImgBtn').addEventListener('click', async () => {
        const file = document.getElementById('quick_img').files[0];
        if(!file) return alert("Pehle ek image select karein!");
        
        const btn = document.getElementById('quickImgBtn');
        btn.innerText = "⏳ Uploading securely...";
        
        try {
            const proxyUrl = await uploadToImgBB_WithProxy(file);
            const imgTag = `&lt;img src="${proxyUrl}" style="width:100%; max-width:600px; border-radius:8px; margin: 20px auto; display:block;" alt="Blog Image"&gt;`;
            
            const codeBox = document.getElementById('code_box');
            codeBox.innerHTML = `✅ Uploaded & Secured! Copy paste this code in your article content:<br><br> ${imgTag}`;
            codeBox.style.display = "block";
            btn.innerText = "Upload & Get Code";
        } catch(e) {
            alert(e.message);
            btn.innerText = "Upload & Get Code";
        }
    });

    // Step 3: Publish Full Article
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const title = document.getElementById('blog_title').value;
        const category = document.getElementById('blog_category').value;
        const excerpt = document.getElementById('blog_excerpt').value;
        const content = document.getElementById('blog_content').value;
        const toolLink = document.getElementById('tool_link').value;
        const thumbFile = document.getElementById('blog_thumbnail').files[0];

        if(!title || !category || !excerpt || !content) {
            return alert("🚨 Title, Category, Excerpt aur Full Content bharna zaruri hai!");
        }

        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        const btn = document.getElementById('submitBtn');

        try {
            btn.innerText = "⏳ SECURING THUMBNAIL & PUBLISHING...";

            // Thumbnail Fallback (Blank string rakhenge taaki blog page pe gray box aaye agar photo na ho)
            let thumbnailUrl = ""; 
            if(thumbFile) {
                thumbnailUrl = await uploadToImgBB_WithProxy(thumbFile); // Isko bhi Proxy milegi!
            }

            await addDoc(collection(db, "blog_posts"), {
                title: title,
                slug: slug,
                category: category,
                excerpt: excerpt,
                content: content,
                thumbnailUrl: thumbnailUrl,
                toolLink: toolLink,
                timestamp: serverTimestamp()
            });

            // Trigger Telegram Alert
            const postUrl = `https://shctools.in/blog.html?post=${slug}`;
            const googleServerUrl = "https://script.google.com/macros/s/AKfycbyo025_xgev4ItpdWA6VaycY4nBPLXvPro97qjhJd4U0kFSv5CmqPks64hz96mCxIsk/exec";
            const finalUrl = googleServerUrl + "?title=" + encodeURIComponent(title) + "&url=" + encodeURIComponent(postUrl);
            fetch(finalUrl, { mode: 'no-cors' }).catch(err => console.log("Telegram alert background trigger"));

            setTimeout(() => {
                alert("🎉 Article Published Successfully with Anti-Block Protection!");
                location.reload();
            }, 1500);

        } catch (e) {
            alert("Error: " + e.message);
            btn.innerText = "🚀 PUBLISH ARTICLE NOW";
        }
    });
</script>
</body>
</html>
