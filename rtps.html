<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHC Extension - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #3498db; color: white; }
        .approve-btn { background-color: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .approve-btn:hover { background-color: #219a52; }
        .status-approved { color: #27ae60; font-weight: bold; }
        .status-pending { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Help Club - Pending Approvals</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Shop Name</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading data...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // Security Password
    let pass = prompt("Enter Admin Password:");
    if(pass !== "Vishal@123") {
        document.body.innerHTML = "<h2 style='color:red; text-align:center;'>Access Denied!</h2>";
        throw new Error("Wrong password");
    }

    // Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC_KuWI90apIc909DZLipXX_QPiI-Ny4qM",
      authDomain: "rtps-auto-fill.firebaseapp.com",
      projectId: "rtps-auto-fill",
      storageBucket: "rtps-auto-fill.firebasestorage.app",
      messagingSenderId: "87553917931",
      appId: "1:87553917931:web:c2bd8881fe236087244fae",
      measurementId: "G-RPDJ7JHY78"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fetch Users
    function loadUsers() {
        db.collection("users").onSnapshot((querySnapshot) => {
            const tbody = document.getElementById("usersTableBody");
            tbody.innerHTML = ""; 

            if(querySnapshot.empty) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align: center;'>No users found!</td></tr>";
                return;
            }

            querySnapshot.forEach((doc) => {
                let user = doc.data();
                let isPending = user.status === 'pending';
                
                let actionHTML = isPending 
                    ? `<button class="approve-btn" onclick="approveUser('${doc.id}')">Approve</button>` 
                    : `<span class="status-approved">Done</span>`;
                
                let statusHTML = isPending 
                    ? `<span class="status-pending">Pending</span>` 
                    : `<span class="status-approved">Approved</span>`;

                let row = `<tr>
                    <td>${user.name}</td>
                    <td>${user.phone}</td>
                    <td>${user.shop}</td>
                    <td>${statusHTML}</td>
                    <td>${actionHTML}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        });
    }

    // Approve User Function
    window.approveUser = function(userId) {
        if(confirm("Are you sure you want to approve this user?")) {
            db.collection("users").doc(userId).update({
                status: "approved"
            }).then(() => {
                alert("User Approved Successfully!");
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }
    }

    // Load data on start
    loadUsers();
</script>

</body>
</html>
