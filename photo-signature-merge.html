<!-- MAIN JAVASCRIPT BLOCK -->
    <script>
    (function() {
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- Mobile Menu Toggle Logic ---
            const mobileBtn = document.getElementById('mobile-menu-btn');
            if (mobileBtn) {
                mobileBtn.addEventListener('click', function() {
                    const menu = document.getElementById('nav-menu');
                    const icon = this.querySelector('i');
                    menu.classList.toggle('active');
                    if(menu.classList.contains('active')) {
                        icon.classList.remove('fa-bars'); icon.classList.add('fa-times');
                    } else {
                        icon.classList.remove('fa-times'); icon.classList.add('fa-bars');
                    }
                });
            }

            // --- MERGER TOOL LOGIC ---
            const processBtn = document.getElementById('processBtn');
            const resultArea = document.getElementById('resultArea');
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            const finalPreview = document.getElementById('finalPreview');
            const finalImageSize = document.getElementById('finalImageSize');
            let finalDataUrl = '';

            // Advanced Background Removal Logic (Luminance Based)
            function removeWhiteBackground(img) {
                const tempCanvas = document.createElement('canvas');
                const tCtx = tempCanvas.getContext('2d');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                tCtx.drawImage(img, 0, 0);

                const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i]; const g = data[i + 1]; const b = data[i + 2];
                    
                    // Luminance formula (calculates true brightness ignoring slight shadows/colors)
                    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;

                    // 110 is a strict threshold for mobile photos
                    if (luma > 110) {
                        data[i + 3] = 0; // Make background transparent
                    } else {
                        // Make the pen ink pure black/dark blue for strong visibility
                        data[i] = 0; data[i+1] = 0; data[i+2] = 30; 
                        data[i+3] = 255; // Ensure ink is fully visible
                    }
                }
                tCtx.putImageData(imgData, 0, 0);
                return tempCanvas;
            }

            if(processBtn) {
                processBtn.addEventListener('click', async () => {
                    const photoFile = document.getElementById('photoUpload').files[0];
                    const sigFile = document.getElementById('sigUpload').files[0];
                    let fileName = document.getElementById('fileName').value.trim();
                    let targetKb = parseFloat(document.getElementById('targetKb').value) || 50;

                    if (!photoFile || !sigFile) {
                        alert("Kripya Photo aur Signature dono select karein.");
                        return;
                    }
                    if(!fileName) fileName = "SHC_Merged_Photo";

                    // UI Loading State
                    processBtn.disabled = true;
                    processBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
                    resultArea.style.display = 'none';

                    try {
                        const photoImg = await loadImage(URL.createObjectURL(photoFile));
                        const sigImg = await loadImage(URL.createObjectURL(sigFile));

                        const transparentSigCanvas = removeWhiteBackground(sigImg);

                        // Set Canvas to standard passport ratio (3.5 x 4.5)
                        canvas.width = 350; 
                        canvas.height = 450; 

                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);

                        // Draw Photo
                        ctx.drawImage(photoImg, 0, 0, canvas.width, canvas.height);

                        // --- Smart Signature Sizing Logic ---
                        let sigW = transparentSigCanvas.width;
                        let sigH = transparentSigCanvas.height;
                        
                        // Maximum allowed size for signature on photo
                        let maxSigWidth = canvas.width * 0.85; // 85% of photo width
                        let maxSigHeight = canvas.height * 0.22; // 22% of photo height

                        // Calculate best ratio to fit within max bounds without stretching
                        let ratio = Math.min(maxSigWidth / sigW, maxSigHeight / sigH);
                        
                        let finalSigW = sigW * ratio;
                        let finalSigH = sigH * ratio;

                        // Center aligning the signature
                        const xOffset = (canvas.width - finalSigW) / 2;
                        const yOffset = canvas.height - finalSigH - 12; // 12px margin from bottom
                        
                        ctx.drawImage(transparentSigCanvas, xOffset, yOffset, finalSigW, finalSigH);

                        // --- Smart Compression Logic ---
                        let quality = 0.95;
                        finalDataUrl = canvas.toDataURL('image/jpeg', quality);
                        let fileSize = Math.round((finalDataUrl.length * 3 / 4) / 1024);

                        // Fast compression loop
                        while (fileSize > targetKb && quality > 0.05) {
                            quality -= 0.05;
                            finalDataUrl = canvas.toDataURL('image/jpeg', quality);
                            fileSize = Math.round((finalDataUrl.length * 3 / 4) / 1024);
                        }

                        // Show Results
                        finalPreview.src = finalDataUrl;
                        finalImageSize.innerHTML = `File Size: <b>${fileSize} KB</b> <br> <span style="font-size: 14px; color: var(--text-muted);">Max Allowed: ${targetKb} KB</span>`;
                        
                        resultArea.style.display = 'block';
                        resultArea.scrollIntoView({ behavior: 'smooth' });

                        // Setup Download Button
                        document.getElementById('downloadBtn').onclick = () => {
                            const a = document.createElement('a');
                            a.href = finalDataUrl;
                            a.download = `${fileName}.jpg`;
                            a.click();
                        };

                    } catch (error) {
                        alert("Error processing images. Please try again.");
                    } finally {
                        processBtn.disabled = false;
                        processBtn.innerHTML = `<i class="fas fa-magic"></i> Merge & Compress Image`;
                    }
                });
            }

            // Helper function
            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }
        });
    })();
    </script>
