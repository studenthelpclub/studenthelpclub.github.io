    <style>
        :root {
            --primary: #00b14f; 
            --primary-hover: #009642;
            --dark: #0f172a; 
            --text-main: #334155; 
            --text-muted: #64748b; 
            --bg-body: #f8fafc; 
            --border-color: #e2e8f0; 
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); line-height: 1.6; }
        
        .header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); padding: 16px 6%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
        .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .brand .brand-title { font-size: 1.35rem; color: var(--dark); font-weight: 800; }
        .nav-menu { display: flex; gap: 20px; align-items: center; }
        .btn-join { background: var(--primary); color: white; padding: 8px 16px; border-radius: 100px; text-decoration: none; font-size: 0.9rem; font-weight: 700; }

        .workspace-container { max-width: 950px; margin: 30px auto 60px; padding: 0 20px; }
        .tool-card { background: #ffffff; padding: 30px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.02); }
        .tool-card h1 { font-size: 1.8rem; color: var(--dark); font-weight: 800; margin-bottom: 6px; text-align: center; }
        .tool-card .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; text-align: center; }

        .mode-switch { display: flex; background: #e2e8f0; border-radius: 12px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--border-color); }
        .mode-switch input[type="radio"] { display: none; }
        .mode-switch label { flex: 1; text-align: center; padding: 14px; font-weight: 700; cursor: pointer; color: var(--text-muted); transition: var(--transition); font-size: 1rem; }
        .mode-switch input[type="radio"]:checked + label { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0, 177, 79, 0.2); }

        .input-group { margin-bottom: 20px; width: 100%; }
        .input-group label { display: block; font-weight: 700; color: var(--dark); margin-bottom: 8px; font-size: 0.95rem; }
        input[type="file"], input[type="text"], input[type="number"] { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; background-color: #fafafa; outline: none; }
        input:focus { border-color: var(--primary); background-color: #ffffff; }

        .flex-group { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; background: #fafafa; margin-bottom: 20px;}

        /* PRO Aadhaar Cropper Styling */
        .aadhaar-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .cropper-wrapper { display: none; margin-top: 15px; }
        .cropper-container-box { width: 100%; height: 350px; background: #cbd5e1; border-radius: 8px; overflow: hidden; border: 2px dashed #94a3b8; }
        .cropper-container-box img { max-width: 100%; display: block; }
        
        .pro-controls { display: flex; gap: 8px; margin-top: 15px; align-items: center; flex-wrap: wrap; background: white; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .ctrl-btn { background: #e2e8f0; color: var(--dark); border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        .ctrl-btn:hover { background: #cbd5e1; }
        .magic-btn { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; width: 100%; justify-content: center; margin-bottom: 5px; padding: 10px;}
        .magic-btn:hover { background: #bae6fd; }
        .slider-group { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 140px; }
        .slider-group span { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
        input[type="range"] { flex: 1; accent-color: var(--primary); }

        .main-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 12px rgba(0, 177, 79, 0.15); }
        .main-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .result-box { display: none; margin-top: 30px; padding: 30px; background: #f0fdf4; border-radius: 16px; border: 1px solid #bbf7d0; text-align: center; animation: fadeIn 0.4s ease; }

        .download-btn:hover { background: #0056b3; }

        canvas { display: none; }

            .nav-menu { display: none; }
            .tool-card { padding: 20px; }
            .cropper-container-box { height: 280px; }
        }

                            <input type="file" id="aadhaarBack" accept="image/*, .heic, .heif">
                        </div>
                        <div id="backCropWrapper" class="cropper-wrapper">
                            <div class="cropper-container-box">
                                <img id="backCropperImg" src="">
                            </div>
                            <div class="pro-controls">
                                <button class="ctrl-btn magic-btn" id="bAutoDetect" type="button"><i class="fas fa-magic"></i> Magic Detect</button>
                                <div style="display:flex; gap:10px; width:100%;">
                                    <button class="ctrl-btn" style="flex:1; justify-content:center;" id="bRotLeft" type="button"><i class="fas fa-undo"></i> Rotate</button>
                                    <button class="ctrl-btn" style="flex:1; justify-content:center;" id="bRotRight" type="button">Rotate <i class="fas fa-redo"></i></button>

                    <input type="text" id="fileNameAadhaar" placeholder="e.g. Vishal_Aadhaar">
                </div>

                <div class="flex-group">
                    <label style="margin-bottom: 0; font-weight: 700; color: var(--dark);">Target Size (Max KB):</label>
                    <input type="number" id="targetKbAadhaar" value="100" style="width: 100px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; text-align: center; font-weight: bold; color: #007bff;">

                <button id="processAadhaarBtn" class="main-btn"><i class="fas fa-layer-group"></i> Merge Standard Aadhaar</button>
            </div>

            <canvas id="resultCanvas"></canvas>

            <div id="resultArea" class="result-box">
                <h3 style="color: var(--primary);"><i class="fas fa-check-circle"></i> Successfully Merged!</h3>
                <img id="finalPreview" src="" alt="Result Preview">
                <div id="finalImageSize" class="result-main"></div>
                <button id="downloadBtn" class="download-btn"><i class="fas fa-download"></i> Download Final Image</button>
            </div>

    <script>
    (function() {
        document.addEventListener("DOMContentLoaded", function() {
            
            // --- UI Setup ---
            const modeRadios = document.querySelectorAll('input[name="toolMode"]');
            const photoSigUI = document.getElementById('photoSigModeUI');
            const aadhaarUI = document.getElementById('aadhaarModeUI');
            const resultArea = document.getElementById('resultArea');
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            const finalPreview = document.getElementById('finalPreview');
            const finalImageSize = document.getElementById('finalImageSize');

            modeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    resultArea.style.display = 'none'; 
                    if (e.target.value === 'photosig') {
                        photoSigUI.style.display = 'block';
                        aadhaarUI.style.display = 'none';
                    } else {
                        photoSigUI.style.display = 'none';
                        aadhaarUI.style.display = 'block';
                    }
                });
            });

            async function getProcessableImageUrl(file) {
                const fileName = file.name.toLowerCase();
                if (fileName.endsWith(".heic") || fileName.endsWith(".heif") || file.type === "image/heic") {
                    if (typeof heic2any === 'undefined') throw new Error("HEIC converter is loading.");
                    const convertedResult = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
                    const blob = Array.isArray(convertedResult) ? convertedResult[0] : convertedResult;
                    return URL.createObjectURL(blob);
                }
                return URL.createObjectURL(file);
            }

            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }

            // ==========================================
            // LOGIC 1: PHOTO + SIGNATURE 
            // ==========================================
            function enhanceSignature(img) {
                const tempCanvas = document.createElement('canvas');
                const tCtx = tempCanvas.getContext('2d');
                tempCanvas.width = img.width; tempCanvas.height = img.height;
                tCtx.drawImage(img, 0, 0);

                const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i]; const g = data[i + 1]; const b = data[i + 2];
                    const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    if (luma > 110) data[i + 3] = 0; 
                    else { data[i] = 0; data[i+1] = 0; data[i+2] = 30; data[i+3] = 255; }
                }
                tCtx.putImageData(imgData, 0, 0);
                return tempCanvas;
            }

            document.getElementById('processPhotoBtn').addEventListener('click', async (e) => {
                const btn = e.target;
                const photoFile = document.getElementById('photoUpload').files[0];
                const sigFile = document.getElementById('sigUpload').files[0];
                let fileName = document.getElementById('fileNamePhoto').value.trim() || "SHC_Merged_Photo";
                let targetKb = parseFloat(document.getElementById('targetKbPhoto').value) || 50;

                if (!photoFile || !sigFile) { alert("Kripya Photo aur Signature dono select karein."); return; }

                btn.disabled = true; btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
                resultArea.style.display = 'none';

                try {
                    const photoUrl = await getProcessableImageUrl(photoFile);
                    const sigUrl = await getProcessableImageUrl(sigFile);
                    const photoImg = await loadImage(photoUrl);
                    const sigImg = await loadImage(sigUrl);
                    const transparentSigCanvas = enhanceSignature(sigImg);

                    canvas.width = 350; canvas.height = 450; 
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(photoImg, 0, 0, canvas.width, canvas.height);

                    let sigW = transparentSigCanvas.width; let sigH = transparentSigCanvas.height;
                    let ratio = Math.min((canvas.width * 0.85) / sigW, (canvas.height * 0.22) / sigH);
                    let finalSigW = sigW * ratio; let finalSigH = sigH * ratio;
                    
                    ctx.drawImage(transparentSigCanvas, (canvas.width - finalSigW) / 2, canvas.height - finalSigH - 12, finalSigW, finalSigH);
                    compressAndShowResult(fileName, targetKb);

                } catch (error) { alert("Error: " + error.message);
                } finally { btn.disabled = false; btn.innerHTML = `<i class="fas fa-magic"></i> Merge Photo & Signature`; }
            });

            // ==========================================
            // LOGIC 2: PRO AADHAAR MERGE (Center-Out Smart Detect)
            // ==========================================
            let fCropper = null, bCropper = null;
            let fBaseAngle = 0, bBaseAngle = 0;

            const setupCropper = async (inputId, imgId, wrapperId, isFront) => {
                const file = document.getElementById(inputId).files[0];
                if (!file) return;
                try {
                    const url = await getProcessableImageUrl(file);
                    document.getElementById(wrapperId).style.display = 'block';
                    const img = document.getElementById(imgId);
                    img.src = url;
                    
                    if (isFront && fCropper) { fCropper.destroy(); fBaseAngle = 0; document.getElementById('fAlignSlider').value = 0; }
                    if (!isFront && bCropper) { bCropper.destroy(); bBaseAngle = 0; document.getElementById('bAlignSlider').value = 0; }
                    
                    const cropperOptions = { 
                        viewMode: 1, 
                        autoCropArea: 0.9, 
                        background: false,
                        guides: true
                    };

                    if (isFront) fCropper = new Cropper(img, cropperOptions);
                    else bCropper = new Cropper(img, cropperOptions);

                } catch (err) { alert(err.message); }
            };

            document.getElementById('aadhaarFront').addEventListener('change', () => setupCropper('aadhaarFront', 'frontCropperImg', 'frontCropWrapper', true));
            document.getElementById('aadhaarBack').addEventListener('change', () => setupCropper('aadhaarBack', 'backCropperImg', 'backCropWrapper', false));

            // Rotation Controls
            document.getElementById('fRotLeft').onclick = () => { fBaseAngle -= 90; updateFRot(); };
            document.getElementById('fRotRight').onclick = () => { fBaseAngle += 90; updateFRot(); };
            document.getElementById('fAlignSlider').oninput = updateFRot;
            function updateFRot() { if(fCropper) fCropper.rotateTo(fBaseAngle + parseFloat(document.getElementById('fAlignSlider').value)); }

            document.getElementById('bRotLeft').onclick = () => { bBaseAngle -= 90; updateBRot(); };
            document.getElementById('bRotRight').onclick = () => { bBaseAngle += 90; updateBRot(); };
            document.getElementById('bAlignSlider').oninput = updateBRot;
            function updateBRot() { if(bCropper) bCropper.rotateTo(bBaseAngle + parseFloat(document.getElementById('bAlignSlider').value)); }

            // NEW: Center-Out Density Detector (Ignores split parts and background)
            function smartDensityDetect(cropper, imgId) {
                if(!cropper) return;
                const img = document.getElementById(imgId);
                const tempC = document.createElement('canvas');
                const tCtx = tempC.getContext('2d');
                
                // Scale down for superfast processing
                const scale = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
                tempC.width = img.naturalWidth * scale;
                tempC.height = img.naturalHeight * scale;
                tCtx.drawImage(img, 0, 0, tempC.width, tempC.height);

                const imgData = tCtx.getImageData(0, 0, tempC.width, tempC.height).data;
                const w = tempC.width;
                const h = tempC.height;

                const rowProfile = new Int32Array(h);
                const colProfile = new Int32Array(w);

                // Build density profile
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;
                        const luma = 0.2126 * imgData[i] + 0.7152 * imgData[i+1] + 0.0722 * imgData[i+2];
                        if (luma > 130) { // Card Brightness Threshold
                            rowProfile[y]++;
                            colProfile[x]++;
                        }
                    }
                }

                // Find highest density peaks (The core of the largest complete card)
                let maxRow = 0, peakY = Math.floor(h/2);
                for(let y=0; y<h; y++) {
                    if(rowProfile[y] > maxRow) { maxRow = rowProfile[y]; peakY = y; }
                }
                
                let maxCol = 0, peakX = Math.floor(w/2);
                for(let x=0; x<w; x++) {
                    if(colProfile[x] > maxCol) { maxCol = colProfile[x]; peakX = x; }
                }

                if (maxRow === 0 || maxCol === 0) return;

                // Inside-Out Expansion: Expand from the solid peak outwards until we hit empty space/gap
                const rowThresh = maxRow * 0.15;
                const colThresh = maxCol * 0.15;

                let top = peakY, bottom = peakY;
                let left = peakX, right = peakX;

                while(top > 0 && rowProfile[top] >= rowThresh) top--;
                while(bottom < h - 1 && rowProfile[bottom] >= rowThresh) bottom++;
                while(left > 0 && colProfile[left] >= colThresh) left--;
                while(right < w - 1 && colProfile[right] >= colThresh) right++;

                const pad = 10;
                cropper.setData({
                    x: Math.max(0, (left / scale) - pad),
                    y: Math.max(0, (top / scale) - pad),
                    width: Math.min(img.naturalWidth, ((right - left) / scale) + (pad*2)),
                    height: Math.min(img.naturalHeight, ((bottom - top) / scale) + (pad*2))
                });
            }

            document.getElementById('fAutoDetect').onclick = () => smartDensityDetect(fCropper, 'frontCropperImg');
            document.getElementById('bAutoDetect').onclick = () => smartDensityDetect(bCropper, 'backCropperImg');

            // Merge & Compress with Auto-Rotate and Skew Fix
            document.getElementById('processAadhaarBtn').addEventListener('click', (e) => {
                const btn = e.target;
                if(!fCropper || !bCropper) { alert("Kripya dono side upload karein."); return; }

                let fileName = document.getElementById('fileNameAadhaar').value.trim() || "SHC_Aadhaar_Merge";
                let targetKb = parseFloat(document.getElementById('targetKbAadhaar').value) || 100;

                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
                btn.disabled = true; resultArea.style.display = 'none';

                setTimeout(() => {
                    try {
                        let fCanvas = fCropper.getCroppedCanvas();
                        let bCanvas = bCropper.getCroppedCanvas();

                        // Auto-Rotate Logic: Make vertical cards horizontal
                        function ensureHorizontal(c) {
                            if (c.height > c.width) {
                                const rot = document.createElement('canvas');
                                rot.width = c.height; rot.height = c.width;
                                const rCtx = rot.getContext('2d');
                                rCtx.translate(rot.width / 2, rot.height / 2);
                                rCtx.rotate(90 * Math.PI / 180);
                                rCtx.drawImage(c, -c.width / 2, -c.height / 2);
                                return rot;
                            }
                            return c;
                        }

                        fCanvas = ensureHorizontal(fCanvas);
                        bCanvas = ensureHorizontal(bCanvas);

                        // Auto-Straighten / Auto-Fix Logic
                        const baseWidth = 800;
                        const baseHeight = 506; // (800 / 1.58 ratio)
                        const gap = 25;

                        canvas.width = baseWidth; 
                        canvas.height = baseHeight + gap + baseHeight;
                        
                        ctx.fillStyle = "#ffffff"; 
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        ctx.drawImage(fCanvas, 0, 0, baseWidth, baseHeight);
                        ctx.drawImage(bCanvas, 0, baseHeight + gap, baseWidth, baseHeight);

                        compressAndShowResult(fileName, targetKb);
                    } catch (err) { alert("Error: " + err.message);
                    } finally { btn.innerHTML = `<i class="fas fa-layer-group"></i> Merge Standard Aadhaar`; btn.disabled = false; }
                }, 100);
            });

            // ==========================================
            // COMPRESSION SYSTEM
            // ==========================================
            function compressAndShowResult(fileName, targetKb) {
                let quality = 0.95;
                let finalDataUrl = canvas.toDataURL('image/jpeg', quality);
                let fileSize = Math.round((finalDataUrl.length * 3 / 4) / 1024);

                while (fileSize > targetKb && quality > 0.05) {
                    quality -= 0.05;
                    finalDataUrl = canvas.toDataURL('image/jpeg', quality);
                    fileSize = Math.round((finalDataUrl.length * 3 / 4) / 1024);
                }

                finalPreview.src = finalDataUrl;
                finalImageSize.innerHTML = `File Size: <b>${fileSize} KB</b> <br> <span style="font-size: 14px; color: var(--text-muted);">Max Allowed: ${targetKb} KB</span>`;
                resultArea.style.display = 'block';
                resultArea.scrollIntoView({ behavior: 'smooth' });

                document.getElementById('downloadBtn').onclick = () => {
                    const a = document.createElement('a'); a.href = finalDataUrl; a.download = `${fileName}.jpg`; a.click();
                };
            }

        });
    })();
    </script>
</body>
