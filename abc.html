<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Handwriting Converter - Student Help Club</title>
    <style>
        /* CSS wahi standard style jo baaki tools me hai */
        .converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .canvas-area { width: 100%; height: 500px; background: #fff; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="workspace-grid">
        <div class="tool-card">
            <h2>Text to Handwriting Converter</h2>
            <div class="input-group">
                <label>Enter Your Text</label>
                <textarea id="textInput" rows="10" placeholder="Type or paste your assignment text here..." oninput="generateHandwriting()"></textarea>
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <label>Ink Color</label>
                    <select id="inkColor" onchange="generateHandwriting()">
                        <option value="blue">Blue Pen</option>
                        <option value="black">Black Pen</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Page Style</label>
                    <select id="pageStyle" onchange="generateHandwriting()">
                        <option value="ruled">Ruled Paper</option>
                        <option value="plain">Plain Paper</option>
                    </select>
                </div>
            </div>
            <button class="btn-download" onclick="downloadAsImage()">Download Image</button>
        </div>

        <div class="preview-sticky-box">
            <canvas id="handwritingCanvas" width="800" height="1000"></canvas>
        </div>
    </div>

    <script>
        function generateHandwriting() {
            const canvas = document.getElementById('handwritingCanvas');
            const ctx = canvas.getContext('2d');
            const text = document.getElementById('textInput').value;
            const inkColor = document.getElementById('inkColor').value;
            const style = document.getElementById('pageStyle').value;

            // Background Render Logic
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if(style === 'ruled') {
                ctx.strokeStyle = "#a3c1da";
                for(let i=50; i<1000; i+=40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(800, i); ctx.stroke(); }
            }

            // Handwriting Style Render Logic
            ctx.fillStyle = (inkColor === 'blue') ? "#00008b" : "#000000";
            ctx.font = "24px 'Dancing Script', cursive"; // Yeh font Google Fonts se link karna hoga
            const lines = splitTextWrap(text, 700, 24);
            lines.forEach((line, i) => { ctx.fillText(line, 50, 80 + (i * 40)); });
        }
        
        function splitTextWrap(text, maxW, size) {
            // Wahi wrapping logic jo resume builder me use kiya hai
            return text.match(/.{1,45}/g) || [];
        }
    </script>
</body>
</html>
